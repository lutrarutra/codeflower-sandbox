version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories:
      - /
      - /dsh-plugins/acp-ws
    schedule:
      interval: weekly
    groups:
      agents:
        patterns: ['*']

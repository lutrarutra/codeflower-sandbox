name: CI

on:
  push:
    branches: [main]
    paths: &paths
      - Dockerfile
      - entrypoint.sh
      - bin/**
      - test/**
      - templates/**
      - dsh-plugins/**
      - package.json
      - package-lock.json
      - Makefile
      - .github/workflows/ci.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-test:
    name: Bridge tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dsh-plugins/acp-ws/package-lock.json

      - name: Install bridge dependencies
        run: make bridge-install

      - name: Run bridge tests
        run: make bridge-test

      - name: Run sandbox diagnostics tests
        run: node --test test/*.test.js

  image:
    name: Image build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The image takes minutes to build: only when something that goes into it changed
      # (the bridge tests above cover dsh-plugins/ on their own).
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            image:
              - Dockerfile
              - entrypoint.sh
              - bin/**
              - templates/**
              - package.json
              - package-lock.json
              - .github/workflows/ci.yml

      - uses: docker/setup-buildx-action@v4
        if: steps.filter.outputs.image == 'true' || github.event_name == 'workflow_dispatch'

      - name: Build the image
        if: steps.filter.outputs.image == 'true' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: codeflower-sandbox:ci
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64

      - name: Check the agent runtimes in the image
        if: steps.filter.outputs.image == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          docker run --rm --entrypoint sh codeflower-sandbox:ci -c '
            set -e
            node --version
            python --version
            uv --version
            rg --version
            # Claude Code is not in the image: the app binds it into these folders.
            test -d /opt/codeflower/agents/claude
            test -z "$(ls -A /opt/codeflower/runtime/node_modules/@anthropic-ai/claude-agent-sdk)"
            ! ls -d /opt/codeflower/runtime/node_modules/@anthropic-ai/claude-agent-sdk-* 2>/dev/null
            codex --version
            dsh --version
            opencode --version
            test -f /opt/codeflower/licenses/opencode.txt
            test -x /opt/codeflower/entrypoint.sh
            CODEFLOWER_AGENT=codex CODEFLOWER_MOUNTS="[]" codeflower-doctor --write-startup /tmp/environment.md
            CODEFLOWER_ENVIRONMENT_FILE=/tmp/environment.md codeflower-doctor
            test -f /opt/codeflower/acp-ws/src/server.js
            test -f /opt/codeflower/templates/TASK.md -a -f /opt/codeflower/templates/task/continue.md -a -f /opt/codeflower/templates/task/wrap-up.md
            test -f /opt/codeflower/src/storyteller/skill/SKILL.md
            export PYTHONPATH=/opt/codeflower/src/storyteller/src
            python -c "import storyteller as sty; r = sty.Report(\"Smoke\", \"/tmp/smoke.html\"); r.text(\"ok\", key=\"t\"); r.save()"
            python -m storyteller.cli check /tmp/smoke.html
            test -f /opt/codeflower/skills/codeflower-sketch/SKILL.md -a -f /opt/codeflower/skills/codeflower-sketch/SOURCES.md
            test -d /data/icons
            rsvg-convert --version
            fc-match -f "%{family}\n" Arial | grep -q "Liberation Sans"
            mkdir -p /tmp/icons
            CODEFLOWER_ICONS=/tmp/icons codeflower-sketch find heart
            codeflower-sketch sources > /dev/null
            printf "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 20 10\"><text id=\"t\" data-label=\"T\" y=\"8\" font-family=\"Arial\" font-size=\"8\">ok</text></svg>" > /tmp/smoke.svg
            CODEFLOWER_ICONS=/tmp/icons codeflower-sketch check /tmp/smoke.svg
            codeflower-sketch render /tmp/smoke.svg
            test -s /tmp/smoke.pdf -a -s /tmp/smoke.png
            # Without fonts the text is missing and the PNG is blank.
            python -c "from PIL import Image; assert Image.open(\"/tmp/smoke.png\").convert(\"L\").getextrema()[0] < 128, \"the text did not render\""
          '
